name: Deploy GitHub Pages

# Publishes the whole repo as before (so /v2/ and other static pages keep working)
# and adds the built React app from app/ at /app/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history: the DEMO build merges main into the demo branch
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build
      # DEMO site (sample data + sample persona + test accounts) at /lumi-app/demo/.
      # New features are tried on the DEMO site first: when a `demo` branch exists, the demo is built from it
      # (the REAL site above is always built from main). Without a `demo` branch it is built from main as before.
      # After pushing `demo`, redeploy with: gh workflow run pages.yml --ref main
      - name: Build DEMO site
        run: |
          if git ls-remote --exit-code --heads origin demo >/dev/null 2>&1; then
            git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/demo:refs/remotes/origin/demo
            git worktree add --detach "$RUNNER_TEMP/demo-src" origin/demo
            cd "$RUNNER_TEMP/demo-src"
            # keep the demo up to date with main: merge main in (only inside this runner, nothing is pushed)
            if ! git merge-base --is-ancestor origin/main HEAD; then
              git -c user.name=ci -c user.email=ci@localhost merge --no-edit origin/main \
                || { git merge --abort || true; echo "::warning::demo branch conflicts with main - DEMO built from demo branch only; merge main into demo"; }
            fi
            echo "DEMO built from demo branch @ $(git rev-parse --short origin/demo) (+ main @ $(git rev-parse --short origin/main) if merged)"
            cd app && npm ci
          else
            echo "DEMO built from main"
            cd app
          fi
          npx tsc -b
          VITE_SITE=demo npx vite build --outDir "$GITHUB_WORKSPACE/app/dist-demo" --emptyOutDir
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude app --exclude _site ./ _site/
          cp -r app/dist _site/app
          cp -r app/dist-demo _site/demo
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

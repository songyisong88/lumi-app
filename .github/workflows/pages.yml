name: Deploy GitHub Pages

# Publishes the whole repo as before (so /v2/ and other static pages keep working)
# and adds the built React app from app/ at /app/.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Build app
        working-directory: app
        run: |
          npm ci
          npm run build
          # DEMO site (sample data + sample persona + test accounts) from the same code at /lumi-app/demo/
          VITE_SITE=demo npx vite build --outDir dist-demo
      - name: Assemble site
        run: |
          mkdir _site
          rsync -a --exclude .git --exclude .github --exclude app --exclude _site ./ _site/
          cp -r app/dist _site/app
          cp -r app/dist-demo _site/demo
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
